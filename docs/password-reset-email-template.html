<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワードリセット</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f5;">
  <table role="presentation" style="width: 100%; border-collapse: collapse; background-color: #f5f5f5;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <!-- メインコンテナ -->
        <table role="presentation" style="max-width: 600px; width: 100%; border-collapse: collapse; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
          
          <!-- ヘッダー -->
          <tr>
            <td style="padding: 40px 40px 30px; text-align: center; border-bottom: 1px solid #e5e5e5;">
              <h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #000000; letter-spacing: -0.5px;">
                パスワードリセット
              </h1>
            </td>
          </tr>
          
          <!-- コンテンツ -->
          <tr>
            <td style="padding: 40px;">
              <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6; color: #333333;">
                パスワードをリセットするリクエストを受け付けました。
              </p>
              
              <p style="margin: 0 0 32px; font-size: 16px; line-height: 1.6; color: #333333;">
                以下のボタンをクリックして、新しいパスワードを設定してください。
              </p>
              
              <!-- ボタン -->
              <table role="presentation" style="width: 100%; border-collapse: collapse;">
                <tr>
                  <td align="center" style="padding: 0;">
                    <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 16px 40px; background-color: #000000; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; transition: background-color 0.3s;">
                      パスワードをリセット
                    </a>
                  </td>
                </tr>
              </table>
              
              <!-- 代替リンク -->
              <p style="margin: 32px 0 0; font-size: 14px; line-height: 1.6; color: #666666;">
                ボタンが表示されない場合は、以下のリンクをコピーしてブラウザに貼り付けてください：
              </p>
              <p style="margin: 12px 0 0; font-size: 12px; line-height: 1.6; color: #999999; word-break: break-all;">
                {{ .ConfirmationURL }}
              </p>
            </td>
          </tr>
          
          <!-- セキュリティ注意書き -->
          <tr>
            <td style="padding: 0 40px 40px;">
              <div style="padding: 20px; background-color: #f9f9f9; border-left: 4px solid #000000; border-radius: 4px;">
                <p style="margin: 0 0 8px; font-size: 13px; font-weight: 600; color: #000000; text-transform: uppercase; letter-spacing: 0.5px;">
                  ⚠️ セキュリティに関する注意
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #666666;">
                  このリクエストを送信していない場合は、このメールを無視してください。パスワードは変更されません。
                </p>
              </div>
            </td>
          </tr>
          
          <!-- フッター -->
          <tr>
            <td style="padding: 30px 40px; border-top: 1px solid #e5e5e5; text-align: center;">
              <p style="margin: 0 0 8px; font-size: 12px; color: #999999;">
                FD GROUP 勤怠管理システム
              </p>
              <p style="margin: 0; font-size: 11px; color: #cccccc;">
                このメールは自動送信されています。返信はできません。
              </p>
            </td>
          </tr>
          
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
