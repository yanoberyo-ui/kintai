<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDGroup 勤怠管理システム</title>
  <link rel="stylesheet" href="../src/styles/main.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- ヘッダー -->
  <header class="bg-white shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-4">
      <h1 class="text-2xl font-bold text-gray-800">FDGroup 勤怠管理</h1>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-3xl mx-auto px-4 py-8">
    <!-- ログイン画面（初期状態） -->
    <div id="login-screen" class="bg-white rounded-lg shadow-md p-8">
      <h2 class="text-xl font-bold mb-6 text-center">ログイン</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">メールアドレス</label>
          <input
            type="email"
            id="login-email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="email@example.com"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">パスワード</label>
          <input
            type="password"
            id="login-password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="パスワード"
          >
        </div>
        <button
          id="login-button"
          class="w-full btn-primary"
        >
          ログイン
        </button>
        <p class="text-sm text-gray-600 text-center mt-4">
          テストユーザー: yamada@fdgroup.com / password123
        </p>
      </div>
    </div>

    <!-- 打刻画面（ログイン後） -->
    <div id="attendance-screen" class="hidden space-y-6">
      <!-- ユーザー情報 -->
      <div class="bg-white rounded-lg shadow-md p-6">
        <p class="text-lg">こんにちは、<span id="user-name" class="font-bold">---</span>さん</p>
      </div>

      <!-- 現在の状態 -->
      <div class="bg-white rounded-lg shadow-md p-6">
        <div class="text-center space-y-4">
          <div>
            <span id="status-badge" class="status-badge bg-gray-200 text-gray-800">未出勤</span>
          </div>

          <div id="time-display" class="hidden">
            <p class="text-gray-600 text-sm">⏰ <span id="clock-in-time">--:--</span> - <span id="current-time">--:--</span></p>
            <p class="text-2xl font-bold text-blue-600 mt-2">📊 勤務時間: <span id="work-duration">0時間0分</span></p>
          </div>

          <!-- ボタンエリア -->
          <div class="space-y-3 mt-6">
            <button id="clock-in-btn" class="w-full btn-primary hidden">
              🌅 出勤する
            </button>
            <button id="clock-out-btn" class="w-full btn-secondary hidden">
              🌆 退勤する
            </button>
            <button id="break-start-btn" class="w-full btn-secondary hidden">
              ☕ 休憩開始<br>
              <span class="text-sm">残り: <span id="break-remaining">60</span>分</span>
            </button>
            <button id="break-end-btn" class="w-full btn-danger hidden">
              🟢 休憩終了
            </button>
          </div>

          <!-- 退勤済みサマリー -->
          <div id="completed-summary" class="hidden mt-6 p-6 bg-blue-50 rounded-lg">
            <h3 class="text-lg font-bold mb-4">📊 今日の勤務サマリー</h3>
            <div class="space-y-2 text-left">
              <p>⏰ <span id="summary-times">09:00 - 18:30</span></p>
              <p>☕ 休憩: <span id="summary-break">1時間00分</span></p>
              <p>⏱️  実働: <span id="summary-work">8時間30分</span></p>
            </div>
            <p class="text-center mt-4 font-bold text-blue-600">お疲れ様でした！</p>
          </div>
        </div>
      </div>

      <!-- TODOリスト -->
      <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <span class="text-xl">📝</span>
            <input
              type="text"
              id="todo-title"
              class="text-lg font-bold border-none focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-2"
              value="今日のtodo"
            >
          </div>
          <button id="delete-todo-list-btn" class="text-red-500 hover:text-red-700">
            🗑️
          </button>
        </div>

        <div class="border-t border-gray-200 my-4"></div>

        <div class="mb-4">
          <p class="text-sm text-gray-600">進捗: <span id="todo-progress" class="font-bold text-gray-900">0%</span></p>
          <p class="text-sm text-gray-600"><span id="todo-completed">0</span>/<span id="todo-total">0</span> タスク完了</p>

          <!-- プログレスバー -->
          <div class="w-full bg-gray-200 rounded-full h-3 mt-2 overflow-hidden">
            <div
              id="todo-progress-bar"
              class="h-full rounded-full transition-all duration-500 ease-out bg-gray-400"
              style="width: 0%"
            ></div>
          </div>
        </div>

        <!-- TODOアイテムリスト -->
        <div class="space-y-4 mb-4">
          <!-- 未完了タスクセクション -->
          <div>
            <h4 class="text-sm font-semibold text-gray-800 mb-2 flex items-center gap-2">
              <span>☐ やること</span>
              <span id="incomplete-count" class="text-xs bg-gray-200 text-gray-800 px-2 py-1 rounded-full">0</span>
            </h4>
            <div id="todo-items-incomplete" class="space-y-2">
              <!-- 未完了タスクがここに表示される -->
            </div>
            <p id="no-incomplete-tasks" class="text-sm text-gray-400 italic hidden mt-2">やることはありません 🎉</p>
          </div>

          <!-- 完了タスクセクション -->
          <div class="border-t border-gray-200 pt-4">
            <button
              id="toggle-completed-btn"
              class="text-sm font-semibold text-gray-600 mb-2 flex items-center gap-2 hover:text-gray-900 w-full text-left transition"
            >
              <span id="toggle-icon">▼</span>
              <span>✓ やったこと</span>
              <span id="completed-count" class="text-xs bg-gray-800 text-white px-2 py-1 rounded-full">0</span>
            </button>
            <div id="todo-items-completed" class="space-y-2">
              <!-- 完了タスクがここに表示される -->
            </div>
          </div>
        </div>

        <!-- TODO追加フォーム -->
        <div class="flex gap-2">
          <input
            type="text"
            id="new-todo-input"
            placeholder="▶️ 新しいタスクを入力..."
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
          <button id="add-todo-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold">
            追加
          </button>
        </div>
      </div>

      <!-- 今月の勤務サマリー -->
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-bold mb-4">📅 今月の勤務</h3>
        <div class="space-y-2">
          <p>勤務日数: <span id="monthly-days" class="font-bold">0</span>日</p>
          <p>累計時間: <span id="monthly-hours" class="font-bold">0</span>時間<span id="monthly-minutes">0</span>分</p>
        </div>
      </div>

      <!-- ログアウトボタン -->
      <div class="text-center">
        <button id="logout-btn" class="text-gray-600 hover:text-gray-800 underline">
          ログアウト
        </button>
      </div>
    </div>

    <!-- エラーメッセージ -->
    <div id="error-message" class="hidden mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
    </div>

    <!-- 成功メッセージ -->
    <div id="success-message" class="hidden mt-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
    </div>
  </main>

  <script type="module" src="../src/app.js"></script>
</body>
</html>
